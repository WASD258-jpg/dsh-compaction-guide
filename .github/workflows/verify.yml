name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs first and blocks the rest: a leaked credential or local path is far more
  # serious than a broken citation, and git history is not undone by a later commit.
  privacy:
    name: privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No credentials, local paths, private addresses, or session data
        run: node tools/privacy-check.mjs .

      - name: Commit identity is not personal
        run: |
          # This repository is published under a neutral identity. A commit made
          # with a personal git config would embed the author's real name and
          # address in history permanently.
          BAD=$(git log --format='%an <%ae>%n%cn <%ce>' | sort -u \
            | grep -vE 'noreply@example\.com|users\.noreply\.github\.com|^$' || true)
          if [ -n "$BAD" ]; then
            echo "Commit identity is not the neutral placeholder:"
            echo "$BAD"
            echo ""
            echo "Set a repository-local identity before committing:"
            echo "  git config user.name  dsh-compaction-guide"
            echo "  git config user.email noreply@example.com"
            exit 1
          fi
          echo "commit identity ok"

  citations:
    name: citation integrity
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every [S…]/[O…]/[P…] marker resolves, none unused
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const path = require('node:path')

          const root = process.cwd()
          const walk = (dir, out = []) => {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (e.name === '.git' || e.name === 'node_modules') continue
              const full = path.join(dir, e.name)
              if (e.isDirectory()) walk(full, out)
              else if (e.name.endsWith('.md')) out.push(full)
            }
            return out
          }

          const refsFile = path.join(root, 'REFERENCES.md')
          if (!fs.existsSync(refsFile)) {
            console.error('REFERENCES.md missing')
            process.exit(1)
          }

          const defined = new Set()
          for (const m of fs.readFileSync(refsFile, 'utf8').matchAll(/\*\*([SOP]\d+[ab]?)\*\*/g)) {
            defined.add(m[1])
          }

          const used = new Set()
          for (const file of walk(root)) {
            if (path.basename(file) === 'REFERENCES.md') continue
            const text = fs.readFileSync(file, 'utf8')
            for (const m of text.matchAll(/\[([SOP]\d+[ab]?)\]/g)) used.add(m[1])
          }

          const dangling = [...used].filter(k => !defined.has(k)).sort()
          const unused = [...defined].filter(k => !used.has(k)).sort()

          console.log(`defined: ${defined.size}, used: ${used.size}`)
          if (dangling.length) {
            console.error('DANGLING citations (used but not defined): ' + dangling.join(', '))
          }
          if (unused.length) {
            console.error('UNUSED citations (defined but never cited): ' + unused.join(', '))
          }
          if (dangling.length || unused.length) process.exit(1)
          console.log('citation graph closed')
          EOF

      - name: Internal links resolve
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const path = require('node:path')

          const walk = (dir, out = []) => {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (e.name === '.git' || e.name === 'node_modules') continue
              const full = path.join(dir, e.name)
              if (e.isDirectory()) walk(full, out)
              else if (e.name.endsWith('.md')) out.push(full)
            }
            return out
          }

          const broken = []
          for (const file of walk(process.cwd())) {
            const text = fs.readFileSync(file, 'utf8')
            for (const m of text.matchAll(/\]\(([^)#h][^)]*\.(?:md|mjs))\)/g)) {
              const target = path.join(path.dirname(file), m[1])
              if (!fs.existsSync(target)) {
                broken.push(`${path.relative(process.cwd(), file)} -> ${m[1]}`)
              }
            }
          }
          if (broken.length) {
            console.error('BROKEN links:\n' + broken.join('\n'))
            process.exit(1)
          }
          console.log('all internal links resolve')
          EOF

  scripts:
    name: verification scripts run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install pinned harness packages
        run: pnpm install --no-frozen-lockfile
        # pnpm is used rather than npm deliberately, and the reason is itself one
        # of this repository's findings.
        #
        # @argszero/cordis-plugin-length-stop-overflow@0.3.0 declares a peer range
        # of ">=0.1.3-alpha.2 <0.1.4 || >=0.1.5-alpha.1 <0.2.0" — which EXCLUDES
        # 0.2.x, the version it was measured working on [O15]. npm enforces peer
        # ranges strictly and refuses to install at all (ERESOLVE); pnpm tolerates
        # the mismatch and installs.
        #
        # The mismatch is a packaging defect in that plugin, not a functional
        # barrier: it was imported and mounted successfully on 0.2.0-rc.2, and
        # verify-argszero/ reproduces that. Using --legacy-peer-deps with npm would
        # also work, but pnpm is what a reader following REPRODUCING.md will have
        # used, so CI matches the documented path.
        #
        # If the plugin fixes its peer range, this note can go — the install will
        # simply keep working.

      - name: Every .mjs in the repository executes
        run: bash verify-refs/ci-preflight.sh

      - name: Citation checker rejects a wrong path
        run: |
          # The checker must fail loudly rather than silently pass when the
          # upstream checkout is missing — otherwise it reports success without
          # resolving anything.
          if node verify-refs/check-refs.mjs /nonexistent 2>/dev/null; then
            echo "check-refs.mjs accepted a non-existent checkout path"
            exit 1
          fi
          echo "ok: rejects a bad path"

      - name: doctor.mjs runs (syntax + empty-corpus path)
        run: |
          mkdir -p /tmp/empty-sessions
          node tools/doctor.mjs /tmp/empty-sessions

      - name: doctor.mjs --json is valid JSON
        run: |
          mkdir -p /tmp/empty-sessions
          node tools/doctor.mjs /tmp/empty-sessions --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const j=JSON.parse(s);
              if(typeof j.sessionsAnalysed!=='number'){console.error('bad shape');process.exit(1)}
              console.log('valid JSON, sessionsAnalysed='+j.sessionsAnalysed);
            })"

  docs:
    name: documentation presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required documents exist
        run: |
          for f in README.md README.zh.md EVIDENCE.md PRIOR-ART.md PLAN.md REFERENCES.md LICENSE; do
            if [ ! -f "$f" ]; then echo "missing: $f"; exit 1; fi
            echo "ok: $f"
          done

      - name: package.json files[] covers required documents
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const files = pkg.files ?? []
          const required = ['README.md', 'README.zh.md', 'EVIDENCE.md', 'PRIOR-ART.md', 'PLAN.md', 'REFERENCES.md', 'LICENSE']
          const missing = required.filter(f => !files.includes(f))
          if (missing.length) {
            console.error('package.json files[] omits: ' + missing.join(', '))
            process.exit(1)
          }
          console.log('package.json files[] covers all required documents')
          EOF

      - name: Both READMEs declare the citation convention
        run: |
          for f in README.md README.zh.md; do
            if ! grep -q "REFERENCES.md" "$f"; then
              echo "$f does not link REFERENCES.md"
              exit 1
            fi
            echo "ok: $f"
          done
